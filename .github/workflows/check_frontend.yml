---
name: Check Frontend

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/README*"
      - ".github/workflows/check.yml"
      - ".github/workflows/check_types.yml"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install the project
        run: |
          uv sync
          pnpm install --frozen-lockfile

      - name: Type check the frontend with tsc
        run: pnpm run check

      - name: Regenerate the api types and the bundle
        run: pnpm run codegen && pnpm run build

      - name: Check the committed generated files are up to date
        run: git diff --exit-code
