---
name: Check Frontend (tsc)

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/README*"
      - ".github/workflows/check.yml"
      - ".github/workflows/check_types.yml"
      - ".github/workflows/test.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned, bun's bundler output is only byte identical within a version, 'latest' would break the diff below.
          bun-version: 1.3.14

      - name: Install the project
        run: |
          uv sync
          bun install --frozen-lockfile

      - name: Type check the frontend with tsc
        run: bun run check

      - name: Regenerate the api types and the bundle
        run: bun run codegen && bun run build

      - name: Check the committed generated files are up to date
        run: git diff --exit-code
