---
name: Test

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/README*"
      - ".github/workflows/check.yml"
      - ".github/workflows/check_types.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Don't bother with beta versions, slow on github.
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --group test

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install frontend dependencies, build frountend
        run: |
          pnpm install --frozen-lockfile
          pnpm run codegen && pnpm run build

      - name: Test with pytest
        run: |
          .venv/bin/coverage run
          .venv/bin/coverage xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
